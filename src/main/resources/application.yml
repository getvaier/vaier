spring:
  application:
    name: vaier
  web:
    resources:
      static-locations: classpath:/static/
      cache:
        cachecontrol:
          no-cache: true
  mvc:
    static-path-pattern: /**
  servlet:
    multipart:
      # The Explorer uploads files into a machine's directory. Spring's defaults (1MB per file, 10MB per
      # request) are sized for form attachments and would refuse almost anything worth putting on a fleet
      # machine — an ISO, a container image, a video. The bytes are never held in Vaier's heap: the part is
      # spooled to a temp file and piped to SFTP with a fixed buffer, so this cap is about what the operator
      # is allowed to send, not about what Vaier can hold.
      max-file-size: 2GB
      max-request-size: 2GB
      # Resolve the parts when they are first asked for, not on every multipart request that arrives. A
      # request refused before it reaches the endpoint then never spools a gigabyte to disk first.
      resolve-lazily: true

server:
  port: 8080
  address: 0.0.0.0
  # The Explorer's shell is 600 KB of script, and a boot reads a dozen JSON lists of 10-16 KB; gzip makes
  # both a fifth of that on a phone. Only these types: an event stream must never be buffered, and a
  # download is bytes.
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml,text/plain

logging:
  level:
    net.vaier: DEBUG
    org.springframework: INFO

wireguard:
  server:
    endpoint: vaier.vaier.net:51820