name: Build and Deploy

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Run tests
      run: mvn test

    # Hard release gate: SpotBugs must pass before any release artifact is built
    # or published. Runs ONLY on a v* tag push, so ordinary main/PR builds skip it.
    # A failure here aborts the job, so the image-push and release-creation steps
    # below never run. Findings are filtered by spotbugs-exclude.xml.
    - name: SpotBugs static analysis (release gate)
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      run: mvn -B com.github.spotbugs:spotbugs-maven-plugin:check

    # #359: Vaier serves its own Android app, so the app is built here and copied into apk/ before the
    # image is. The runner already carries the Android SDK. Signing comes from three secrets; the Gradle
    # build falls back to the debug key when VAIER_ANDROID_KEYSTORE is unset, so a repository without
    # them — a fork, a PR from one — still produces a working image rather than a failed job.
    - name: Build the Android app
      env:
        VAIER_ANDROID_KEYSTORE_B64: ${{ secrets.VAIER_ANDROID_KEYSTORE_B64 }}
        VAIER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.VAIER_ANDROID_KEYSTORE_PASSWORD }}
        VAIER_ANDROID_KEY_ALIAS: ${{ secrets.VAIER_ANDROID_KEY_ALIAS }}
      run: |
        if [ -n "${VAIER_ANDROID_KEYSTORE_B64:-}" ]; then
          printf '%s' "$VAIER_ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export VAIER_ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
        fi
        cd android
        ./gradlew --no-daemon assembleRelease
        cp app/build/outputs/apk/release/app-release.apk ../apk/vaier.apk

    - name: Build Docker image
      run: |
        VAIER_VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
        docker build --build-arg VAIER_VERSION="${VAIER_VERSION}" --build-arg VAIER_REVISION=${{ github.sha }} -t vaier:${{ github.sha }} .
        docker tag vaier:${{ github.sha }} vaier:latest

    - name: Log in to Docker Hub
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push Docker image (main)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        docker tag vaier:latest ${{ secrets.DOCKER_USERNAME }}/vaier:latest
        docker tag vaier:latest ${{ secrets.DOCKER_USERNAME }}/vaier:${{ github.sha }}
        docker push ${{ secrets.DOCKER_USERNAME }}/vaier:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/vaier:${{ github.sha }}

    - name: Push Docker image (release tag)
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        docker tag vaier:latest ${{ secrets.DOCKER_USERNAME }}/vaier:${VERSION}
        docker push ${{ secrets.DOCKER_USERNAME }}/vaier:${VERSION}

    - name: Prepare release compose file
      id: prepare_release
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        mkdir -p release
        sed "s|getvaier/vaier:latest|getvaier/vaier:${VERSION}|" \
          docker-compose.yml > release/docker-compose.yml

    - name: Create GitHub Release
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: release/docker-compose.yml
        body: |
          ## Deploying

          Download `docker-compose.yml` from the assets below (pinned to
          `getvaier/vaier:${{ steps.prepare_release.outputs.version }}`),
          set the required env vars, then:

          ```bash
          docker compose up -d
          ```

          The `Source code (zip/tar.gz)` archives are generated
          automatically by GitHub and are **not** needed to deploy.
